name: Atualizar notícias

on:
  schedule:
    # 6 vezes ao dia, de 3 em 3 horas, das 06h às 21h (horário de Brasília = UTC-3)
    - cron: "7 9,12,15,18,21,0 * * *"
  workflow_dispatch:       # permite rodar na mão pela aba Actions

permissions:
  contents: write

concurrency:
  group: atualizar-noticias
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_news.py
      - name: Publicar mudanças
        run: |
          git config user.name "pauta-bot"
          git config user.email "pauta-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "Atualiza notícias" && git pull --rebase && git push)
