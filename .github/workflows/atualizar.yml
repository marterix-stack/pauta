name: Atualizar notícias

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 06h no horário de Brasília
  workflow_dispatch:       # permite rodar na mão pela aba Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_news.py
      - name: Publicar mudanças
        run: |
          git config user.name "pauta-bot"
          git config user.email "pauta-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "Atualiza notícias" && git push)
