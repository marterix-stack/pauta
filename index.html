dialog .in{padding:20px 26px 26px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

{s:"ep",c:"Cultura",d:"2026-10-15",r:3,t:"Festival de Cinemas dos Povos começa em Belém e segue até 21 de outubro",x:"A sétima edição do FIFEP acontece no Cine Líbero Luxardo.",l:"A agenda cultural da cidade para o fim de semana também trouxe teatro infantil inspirado em Brecht, a exposição de realidade virtual Floresta Encantada e música ligada ao Círio de Nazaré.",u:"https://estadodoparaonline.com/agenda-cultural-belem-cinema-teatro-exposicoes-outubro-2026/"},
{s:"on",c:"Cultura",d:"2026-10-06",r:3,t:"Fim de outubro nos cinemas tem Ozzy e Black Sabbath e transmissão ao vivo do BTS",x:"O filme-show do Black Sabbath estreia dia 28, e a sessão do BTS em São Paulo, dia 30.",l:"No dia 29 chegam, entre outros, As Dez Vantagens de Morrer Depois de Você e o Festival de Cinema Francês do Brasil. Dia 24 há sessões do Hybe Cine Fest.",u:"https://www.oficinadanet.com.br/entretenimento/73132-filmes-cinemas-outubro-2026-estreias"}
].map(n=>({...n,id:hid(n.u+n.t)}));
let NEWS=[];
const ready=fetch("news.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{if(!j.items||!j.items.length)throw 0;Object.assign(SRC,j.sources||{});SNAP=new Date();UPD=j.updated;NEWS=j.items.map(n=>({...n,id:hid(n.u+n.t)}))}).catch(()=>{NEWS=SNAPSHOT});
const $=s=>document.querySelector(s);
const PS=10;
const byId=id=>NEWS.find(x=>x.id===id)||st.saved.get(id);
const sr=n=>sr(n)||[n.s,"#888"];
const st={cat:"Todas",q:"",off:new Set(),saved:new Map(),per:99,ord:"d",n:PS,fs:17};
try{JSON.parse(localStorage.getItem("pauta-saved3")||"[]").forEach(n=>st.saved.set(n.id,n))}catch(e){}
const persist=()=>{try{localStorage.setItem("pauta-saved3",JSON.stringify([...st.saved.values()]))}catch(e){}};
const cats=["Todas","Brasil","Economia","Mundo","Tecnologia","Ciência","Esportes","Cultura","Salvas"];
const age=d=>Math.round((SNAP-new Date(d+"T12:00:00"))/864e5);
const when=d=>{const a=age(d);return a<=0?"hoje":a===1?"ontem":`há ${a} dias`};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hl=s=>{s=esc(s);if(!st.q)return s;const r=st.q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return s.replace(new RegExp("("+r+")","ig"),"<mark>$1</mark>")};
function thumb(n,cls){const h=H[n.c],k=n.id,u=k+(cls||"");let g="";
  for(let j=0;j<4;j++){const x=(k*37+j*53)%160,y=(k*23+j*31)%90,r=14+(k*7+j*11)%32;g+=`<circle cx="${x}" cy="${y}" r="${r}" fill="hsl(${h+j*14} 75% ${58+j*6}%)" opacity=".3"/>`}
  return `<svg class="th" viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="g${u}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h} 60% 36%)"/><stop offset="1" stop-color="hsl(${h+40} 65% 20%)"/></linearGradient></defs><rect width="160" height="90" fill="url(#g${u})"/>${g}</svg>`}
const chip=n=>`<span class="chip" style="--h:${H[n.c]}">${n.c}</span>`;
const meta=n=>`<div class="meta"><span class="dot" style="background:${sr(n)[1]}"></span><strong>${sr(n)[0]}</strong><span>${when(n.d)}</span></div>`;
$("#date").textContent=SNAP.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
function nav(){
  $("#cats").innerHTML=cats.map(c=>{const n=c==="Todas"?NEWS.length:c==="Salvas"?st.saved.size:NEWS.filter(x=>x.c===c).length;const d=H[c]!=null?`<span class="dot" style="background:hsl(${H[c]} 65% 50%)"></span>`:"";return `<button data-c="${c}" aria-pressed="${st.cat===c}">${d}${c}<b>${n}</b></button>`}).join("");
  if(!$("#srcs").children.length||true){const open=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.s;
    $("#srcs").innerHTML=Object.entries(SRC).map(([k,v])=>`<label><input type="checkbox" data-s="${k}" ${st.off.has(k)?"":"checked"}><span class="dot" style="background:${v[1]}"></span>${v[0]}</label>`).join("");
    if(open){const el=$(`[data-s="${open}"]`);if(el)el.focus()}}
}
function list(){
  const q=st.q.toLowerCase();
  return (st.cat==="Salvas"?[...st.saved.values()]:NEWS).filter(n=>!st.off.has(n.s)&&age(n.d)<=st.per&&(st.cat==="Todas"||st.cat==="Salvas"||n.c===st.cat)&&(!q||(n.t+" "+n.x).toLowerCase().includes(q)))
   .sort((a,b)=>st.ord==="r"?b.r-a.r||age(a.d)-age(b.d):age(a.d)-age(b.d)||b.r-a.r);
}
const acts=n=>`<div class="act"><button class="save" data-v="${n.id}" aria-pressed="${st.saved.has(n.id)}">${st.saved.has(n.id)?"Salva":"Salvar"}</button><button class="btn" data-o="${n.id}">Ler resumo</button><a class="btn" href="${n.u}" target="_blank" rel="noopener">Fonte</a></div>`;
function render(){
  nav();
  const l=list(),f=$("#feed");
  $("#count").textContent=`${l.length} ${l.length===1?"notícia":"notícias"}`;
  if(!l.length){f.innerHTML=`<div class="empty">${st.cat==="Salvas"?"Você ainda não salvou nenhuma notícia. Use o botão Salvar em qualquer matéria.":"Nenhuma notícia encontrada. Limpe a busca, amplie o período ou ative mais fontes."}</div>`;$("#more").hidden=true;return}
  const v=l.slice(0,st.n),[a,...rest]=v;
  f.innerHTML=`<article class="hero">${thumb(a,"H")}<div class="in">${chip(a)}<h3 data-o="${a.id}" tabindex="0">${hl(a.t)}</h3><p class="s">${hl(a.x)}</p>${meta(a)}${acts(a)}</div></article>`+
   `<div class="grid">`+rest.map(n=>`<article class="card">${thumb(n)}<div class="in">${chip(n)}<h3 data-o="${n.id}" tabindex="0">${hl(n.t)}</h3><p class="s">${hl(n.x)}</p>${meta(n)}${acts(n)}</div></article>`).join("")+`</div>`;
  $("#more").hidden=l.length<=st.n;
}
function open(id){
  const n=byId(id),d=$("#dlg"),s=st.saved.has(id);
  d.innerHTML=`${thumb(n,"D")}<div class="in">${chip(n)}<h3>${esc(n.t)}</h3>${meta(n)}<div class="read" style="--fs:${st.fs}px;margin-top:12px"><p>${esc(n.x)}</p>${n.l?`<p>${esc(n.l)}</p>`:""}</div><div class="row"><a class="btn p" href="${n.u}" target="_blank" rel="noopener">Ler na ${esc(sr(n)[0])}</a><button class="btn" data-v="${id}">${s?"Remover dos salvos":"Salvar"}</button><button class="btn" data-fs="-2" aria-label="Diminuir texto">A−</button><button class="btn" data-fs="2" aria-label="Aumentar texto">A+</button><button class="btn" data-close>Fechar</button></div></div>`;
  d.dataset.id=id;if(!d.open)d.showModal();
}
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-c]");if(c){st.cat=c.dataset.c;st.n=PS;render();return}
  const v=e.target.closest("[data-v]");if(v){const id=+v.dataset.v;st.saved.has(id)?st.saved.delete(id):st.saved.set(id,byId(id));persist();render();if($("#dlg").open)open(id);return}
  const f=e.target.closest("[data-fs]");if(f){st.fs=Math.min(26,Math.max(14,st.fs+ +f.dataset.fs));open(+$("#dlg").dataset.id);return}
  if(e.target.closest("[data-close]")||e.target===$("#dlg")){$("#dlg").close();return}
  const o=e.target.closest("[data-o]");if(o)open(+o.dataset.o);
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset.o)open(+e.target.dataset.o)});
document.addEventListener("change",e=>{const s=e.target.dataset.s;if(s){e.target.checked?st.off.delete(s):st.off.add(s);st.n=PS;render()}});
$("#q").addEventListener("input",e=>{st.q=e.target.value.trim();st.n=PS;render()});
$("#per").addEventListener("change",e=>{st.per=+e.target.value;st.n=PS;render()});
$("#ord").addEventListener("change",e=>{st.ord=e.target.value;render()});
$("#more").addEventListener("click",()=>{st.n+=PS-1;render()});
$("#theme").addEventListener("click",()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"});
ready.then(()=>{
  $("#date").textContent=SNAP.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
  $("#note").textContent=UPD?`Atualizado automaticamente em ${new Date(UPD).toLocaleString("pt-BR")}. Títulos e resumos pertencem aos veículos indicados: use o botão Fonte para ler a matéria completa. As imagens são ilustrações geradas pelo app.`:"Não foi possível carregar news.json; exibindo um retrato de 19/10/2026. Títulos e resumos reescritos a partir das fontes indicadas.";
  render();
});
</script>
</body>
</html>
